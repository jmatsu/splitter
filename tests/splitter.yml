deployments:
  case1:
    service: "deploygate"
    app-owner-name: "format:${DEPLOYGATE_APP_OWNER_NAME}"
  case2:
    service: "firebase-app-distribution"
    credentials-path: "./.fixtures/google_credentials.json"
    app-id: 'format:${TEST_FIREBASE_APP_ID}'
  case3:
    service: "local"
    destination-path: "./dist/sample.txt"
